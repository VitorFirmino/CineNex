<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #050505; padding: 60px 15px; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
    <tr>
        <td align="center">
            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px;">
                <tr>
                    <td align="center" style="padding-bottom: 60px;">
                        <span style="font-size: 48px; font-weight: 900; letter-spacing: -0.06em; text-transform: uppercase; line-height: 1;">
                            <span style="color: #ffffff;">CINE</span><span style="color: #34d399;">NEX</span>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td style="background-color: #0a0a0c; border: 1px solid #1a1a1e; border-radius: 24px; padding: 56px 40px; box-shadow: 0 40px 100px rgba(0,0,0,0.8);">
                        <h1 style="margin: 0 0 20px 0; color: #ffffff; font-size: 32px; font-weight: 800; letter-spacing: -0.05em; line-height: 1.2; text-align: left;">
                            Confirmar <span style="color: #10b981;">Cadastro</span>
                        </h1>
                        <p style="margin: 0 0 40px 0; color: #94a3b8; font-size: 16px; line-height: 1.7; font-weight: 400; text-align: left;">
                            Seja bem-vindo ao <strong style="color: #ffffff;">CineNex</strong>! Clique no botão abaixo para validar seu acesso:
                        </p>
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 32px;">
                            <tr>
                                <td align="center" style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 15px 35px rgba(255, 255, 255, 0.1);">
                                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: block; padding: 22px 24px; color: #050505; text-decoration: none; font-weight: 800; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">
                                        CONFIRMAR E-MAIL
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 40px; background-color: #050505; border: 1px dashed #1a1a1e; border-radius: 12px;">
                            <tr>
                                <td align="center" style="padding: 20px;">
                                    <p style="margin: 0 0 8px 0; font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.2em;">Código de Validação</p>
                                    <p style="margin: 0; font-family: ui-monospace, 'Cascadia Code', monospace; font-size: 18px; font-weight: 700; color: #10b981; letter-spacing: 4px;">
                                        {{ .Token }}
                                    </p>
                                </td>
                            </tr>
                        </table>
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #050505; border-radius: 16px; border: 1px solid #1a1a1e;">
                            <tr>
                                <td style="padding: 24px;">
                                    <p style="margin: 0 0 8px 0; font-size: 11px; font-weight: 800; color: #34d399; text-transform: uppercase; letter-spacing: 0.2em;">Validação CineNex</p>
                                    <p style="margin: 0; font-size: 13px; color: #64748b; line-height: 1.5;">
                                        Este e-mail foi enviado para <span style="color: #ffffff;">{{ .Email }}</span> através do domínio <span style="color: #10b981;">{{ .SiteURL }}</span>.
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding: 40px 20px 0 20px;">
                        <p style="margin: 0; color: #334155; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4em;">
                            &copy; 2026 CINENEX &bull; DIGITAL ACCESS PORTAL
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
